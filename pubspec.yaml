name: bluepink_pdf_reader
description: A blue and pink interactive PDF reader for Flutter web and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.7
  shared_preferences: ^2.5.3
  syncfusion_flutter_pdfviewer: ^33.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_study_guide.pdf